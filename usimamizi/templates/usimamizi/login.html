<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodi Manager - Ingia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>select[name=jengo],select[name=jengo] option,#tafutaInput,#tafutaInput::placeholder,.lbl-bold{font-weight:700!important;color:#111!important;opacity:1!important}</style><style id='km-theme'>body{background:linear-gradient(135deg,#e0f2fe 0%,#bae6fd 50%,#7dd3fc 100%)!important;background-attachment:fixed!important;min-height:100vh;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}.navbar,.bg-dark{background:linear-gradient(90deg,#0369a1 0%,#0284c7 55%,#0ea5e9 100%)!important;box-shadow:0 4px 16px rgba(2,132,199,.25)!important;border-bottom:2px solid rgba(255,255,255,.25)!important;}.btn-dark{background-color:#0369a1!important;border-color:#0369a1!important;color:#ffffff!important;}.btn-dark:hover{background-color:#0284c7!important;border-color:#0284c7!important;}.card{background:rgba(255,255,255,.96)!important;border-radius:14px!important;box-shadow:0 6px 20px rgba(2,132,199,.10)!important;overflow:hidden;transition:transform .18s ease,box-shadow .18s ease;}.card:hover{box-shadow:0 10px 26px rgba(2,132,199,.16)!important;}.row.g-2>div:nth-child(1) .card{background:linear-gradient(135deg,#ffffff 0%,#bae6fd 100%)!important;border-top:4px solid #0284c7!important;}.row.g-2>div:nth-child(2) .card{background:linear-gradient(135deg,#ffffff 0%,#ccfbf1 100%)!important;border-top:4px solid #0d9488!important;}.row.g-2>div:nth-child(3) .card{background:linear-gradient(135deg,#ffffff 0%,#fef3c7 100%)!important;border-top:4px solid #d97706!important;}.row.g-2>div:nth-child(4) .card{background:linear-gradient(135deg,#ffffff 0%,#e0f2fe 100%)!important;border-top:4px solid #0ea5e9!important;}.card-header{background:linear-gradient(90deg,#f0f9ff 0%,#bae6fd 100%)!important;border-bottom:2px solid #7dd3fc!important;color:#0c4a6e!important;padding:.75rem 1rem!important;}.table thead th,.table-dark th{background:#0284c7!important;color:#ffffff!important;border:none!important;font-weight:700!important;}.table tbody tr:hover{background-color:#e0f2fe!important;}#tafutaInput,select[name=jengo]{background:#ffffff!important;border:2px solid #0284c7!important;border-radius:10px!important;box-shadow:0 2px 8px rgba(2,132,199,.12);}</style></head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h4 class="fw-bold mb-0">Kodi Manager</h4>
                    <small class="text-light">Ingia kwenye akaunti yako</small>
                </div>
                <div class="card-body p-4">
                    {% if form.errors %}
                        <div class="alert alert-danger py-2 small">
                            Jina la mtumiaji au nenosiri si sahihi. Jaribu tena.
                        </div>
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Jina la Mtumiaji (Username)</label>
                            <input type="text" name="username" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Nenosiri (Password)</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 fw-semibold">Ingia</button>
                    </form>
                    <hr>
                    <p class="text-center small mb-0">
                        Huna akaunti bado? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Jisajili hapa</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
